<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            background-color: lightcyan;
        }
        button {
            background-color: blueviolet;
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Game</title>
</head>
<body>
    <u>
        <h1 style="text-align: center;">
           Guess The Fruit!
        </h1>
    </u>
    <h3>
        Score: <span id="scoreBoard">0</span>
    </h3>
    <h3>1. I am red and sweet.🍎:- <input type="text" id="FruitName"></h3>
    <button type="button" onclick="CheckSpelling()">Check Spelling</button>
    <p id="message"></p>
    <h3>2. I am long and yellow.🍌:- <input type="text" id="FruitName2"></h3>
    <button type="button" onclick="CheckSpelling2()">Check Spelling</button>
    <p id="message2"></p>
    <h3>3. I am red and green.🍉:- <input type="text" id="FruitName3"></h3>
    <button type="button" onclick="CheckSpelling3()">Check Spelling</button>
    <p id="message3"></p>
    <h3>4. I am round and yellow .🍋:- <input type="text" id="FruitName4"></h3>
    <button type="button" onclick="CheckSpelling4()">Check Spelling</button>
    <p id="message4"></p>
    <h3>5. I am red and sweet .🍓:- <input type="text" id="FruitName5"></h3>
    <button type="button" onclick="CheckSpelling5()">Check Spelling</button>
    <p id="message5"></p>
</body>
<script>
    let score = 0;
    function CheckSpelling()
    {
        let userAnswer = document.getElementById("FruitName").value;
        if (userAnswer.toUpperCase() == "APPLE")
        {
            document.getElementById("message").innerText = "Superb! Correct Answer";
            document.getElementById("message").style.color = "Green";
            score = score + 10;
            document.getElementById("scoreBoard").innerText = score;
        }
        else
        {
           document.getElementById("message").innerText = "Oops! Try Again.";
            document.getElementById("message").style.color = "Red";  
        }
    }
